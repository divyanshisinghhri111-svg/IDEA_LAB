<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>College Feedback Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form>
        <!-- Big Heading added at the beginning -->
        <h1>College Feedback Form</h1>

        <!-- Student Name -->
        <label for="name">Student Name</label>
        <input type="text" id="name">

        <!-- Email -->
        <label for="email">Email</label>
        <input type="email" id="email">

        <!-- Course -->
        <label for="course">Course</label>
        <input type="text" id="course">

        <!-- Semester -->
        <label for="semester">Semester</label>
        <input type="text" id="semester">

        <!-- Gender -->
        <label>Gender</label>
        <div class="gender-options">
            <input type="radio" id="male" name="gender"> <label for="male" class="radio-label">Male</label>
            <input type="radio" id="female" name="gender"> <label for="female" class="radio-label">Female</label>
        </div>

        <!-- Rating dropdown -->
        <label for="rating">Rating dropdown</label>
        <select id="rating">
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
        </select>

        <!-- Feedback textarea -->
        <label for="feedback">Feedback textarea</label>
        <textarea id="feedback" rows="4"></textarea>

        <!-- Action Buttons -->
        <div class="button-group">
            <button type="submit">Submit button</button>
            <button type="reset">Reset button</button>
        </div>
    </form>

</body>
</html>
